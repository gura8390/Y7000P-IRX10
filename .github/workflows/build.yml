name: CSharp portable build and isolated regression tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: csharp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'gura8390/Y7000P-IRX10'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Build portable app without private debug paths
        shell: pwsh
        run: |
          dotnet restore LenovoLegionToolkit.WPF/LenovoLegionToolkit.WPF.csproj --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish LenovoLegionToolkit.WPF/LenovoLegionToolkit.WPF.csproj -c Release -p:Platform=x64 -p:DebugType=None -p:DebugSymbols=false '-p:PathMap=${{ github.workspace }}=/_/src' --no-restore -o artifacts/app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Isolated regressions
        shell: pwsh
        run: |
          foreach ($project in @('Thermal.Tests','Regression.Tests','AutomationStartup.Tests','Firmware.Tests','ThermalLifecycle.Tests')) {
            dotnet run --project "tests/$project/$project.csproj" -c Release -p:Platform=x64 -p:DebugType=None
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Upload app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: csharp-app
          path: artifacts/app/
          if-no-files-found: error
