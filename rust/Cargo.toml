[workspace]
members = ["crates/jiks-core", "crates/jiks-platform", "crates/jiks-store", "crates/jiks-runtime", "crates/jiks-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "=1.0.104"
sha2 = "=0.10.9"
quick-xml = "=0.38.4"
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision", "raw_value", "preserve_order", "float_roundtrip"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_Threading",
    "Win32_System_ProcessStatus", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Console", "Win32_System_Time",
    "Win32_System_Registry", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_RemoteDesktop", "Win32_System_Environment", "Win32_System_EventLog",
    "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Etw", "Win32_System_Performance", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Pipes", "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange",
    "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_Ndis",
    "Win32_Media_Audio",
    "Wdk_Graphics_Direct3D",
    "Win32_Networking_WinHttp", "Win32_System_Services", "Win32_System_WindowsProgramming", "Win32_Globalization",
    "Win32_Devices_HumanInterfaceDevice", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Display", "Win32_System_Com"
] }
wmi = "=0.14.5"
rust_decimal = { version = "=1.43.0", default-features = false, features = ["std", "serde-with-arbitrary-precision"] }
windows = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Wmi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Devices_Display_Core", "Foundation", "Foundation_Collections", "Foundation_Numerics", "Graphics", "Win32_System_WinRT", "Win32_System_TaskScheduler"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 1
